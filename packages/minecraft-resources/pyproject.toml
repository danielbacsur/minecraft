[project]
name = "minecraft-resources"
requires-python = ">=3.12"
version = "0.0.0"

dependencies = [
    "tqdm>=4.70.0",
]

[project.scripts]
download = "minecraft_resources.download:download"

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_resources"]

[tool.ruff.lint.isort]
lines-after-imports = 2
