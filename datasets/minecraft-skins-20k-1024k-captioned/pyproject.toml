[project]
name = "minecraft-skins-20k-1024k-captioned"
requires-python = ">=3.12"
version = "0.0.0"

dependencies = [
    "datasets>=4.0.0",
    "hishel[httpx]>=1.3.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
    "selectolax>=0.4.11",
    "voyageai>=0.5.0",
]

[project.scripts]
download = "minecraft_skins_20k_1024k_captioned.download:download"
normalize = "minecraft_skins_20k_1024k_captioned.normalize:normalize"
render = "minecraft_skins_20k_1024k_captioned.render:render"
caption = "minecraft_skins_20k_1024k_captioned.caption:caption"
embed = "minecraft_skins_20k_1024k_captioned.embed:embed"
push = "minecraft_skins_20k_1024k_captioned.push:push"
index = "minecraft_skins_20k_1024k_captioned.index:index"
sync = "minecraft_skins_20k_1024k_captioned.sync:sync"

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_skins_20k_1024k_captioned"]

[tool.ruff.lint.isort]
lines-after-imports = 2
